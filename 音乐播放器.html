<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>音乐播放器</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --bg: #f5f6fa;
    --panel: #ffffff;
    --text: #1f2430;
    --text-2: #6b7280;
    --border: #e8eaf1;
    --shadow: 0 4px 16px rgba(31,36,48,.06);
    --radius: 14px;
    --fs: 1; /* 整体字体缩放倍数（只作用于歌单标题 / 歌名 / 歌词） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  /* 移动端浏览器地址栏收起/展开会让 100% 抖动，dvh 跟随可视视口，界面不会被裁掉一条 */
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  body {
    font-family: "MiSans", "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;   /* 横屏时不擅自放大字号 */
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d4d8e4; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #b9bfd2; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; flex: none; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff;
  }
  .search-box { display: flex; flex: 1; max-width: 560px; margin: 0 auto; }
  .search-box input {
    flex: 1; height: 42px; padding: 0 18px;
    border: 1px solid var(--border); border-right: none;
    border-radius: 21px 0 0 21px; outline: none;
    font-size: 14px; background: var(--bg);
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    height: 42px; padding: 0 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 0 21px 21px 0; font-size: 14px;
  }
  .search-box button:hover { filter: brightness(1.08); }
  .header-pad { flex: none; width: 130px; }
  /* ---------- 整体字体大小控件 ---------- */
  .fs-ctrl {
    flex: none; display: flex; align-items: center; gap: 4px;
    height: 40px; padding: 0 8px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg);
    font-size: 13px; color: var(--text); user-select: none;
  }
  .fs-btn {
    height: 28px; min-width: 32px; padding: 0 9px; border-radius: 8px;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    color: var(--text-2); background: #fff;
    transition: background .15s, color .15s, transform .1s;
  }
  .fs-btn:hover { background: #eceafd; color: var(--accent); }
  .fs-btn:active { transform: scale(.92); }
  .fs-val { min-width: 42px; text-align: center; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
  .menu-btn {
    display: none; width: 36px; height: 36px; border-radius: 10px; flex: none;
    place-items: center; color: #5b6170;
  }
  .menu-btn:hover { background: #f1f2f9; }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    flex: none; width: 190px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 10px; gap: 4px; overflow-y: auto;
  }
  .sb-close {
    display: none; position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 32px; height: 32px; border-radius: 8px; place-items: center;
    font-size: 20px; line-height: 1; color: #9aa1b2;
  }
  .sb-close:hover { background: #f1f2f9; color: var(--text); }
  .sb-title {
    font-size: calc(12px * var(--fs, 1)); color: #9aa1b2; padding: 8px 10px 4px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sb-new {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    color: #9aa1b2; font-size: 15px; line-height: 1;
  }
  .sb-new:hover { background: #f1f2f9; color: var(--accent); }
  .sb-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 9px; cursor: pointer; font-size: calc(13.5px * var(--fs, 1)); color: #454b59;
    transition: background .15s; position: relative; flex: none;
  }
  .sb-item:hover { background: #f1f2f9; }
  .sb-item.active { background: #eceafd; color: var(--accent); font-weight: 600; }
  .sb-item .sb-icon { flex: none; display: grid; place-items: center; color: #9aa1b2; width: 18px; }
  .sb-item.active .sb-icon { color: var(--accent); }
  .sb-item .sb-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-item .sb-count { font-size: calc(11px * var(--fs, 1)); color: #b3b8c6; flex: none; }
  .sb-item .sb-more {
    flex: none; width: 22px; height: 22px; border-radius: 6px;
    display: none; place-items: center; color: #9aa1b2; font-size: 15px; letter-spacing: 1px;
  }
  .sb-item:hover .sb-more { display: grid; }
  .sb-item .sb-more:hover { background: #e3e5ef; color: var(--text); }
  .sb-empty { font-size: calc(12px * var(--fs, 1)); color: #b3b8c6; padding: 6px 10px; line-height: 1.8; }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: flex; min-height: 0; padding: 16px 22px; gap: 16px; }
  .panel {
    background: var(--panel); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0;
  }
  .list-panel { flex: 1.25; min-width: 0; }
  .lyric-panel { flex: 1; min-width: 0; display: none; }
  .lyric-panel.show { display: flex; }
  .panel-head {
    flex: none; padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-head .sub { font-size: 12px; color: var(--text-2); font-weight: 400; }
  #listTitle { font-size: calc(15px * var(--fs, 1)); }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px 10px; position: relative; }

  /* 歌曲行 */
  .song-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background .15s;
  }
  .song-row:hover { background: #f1f2f9; }
  .song-row.playing { background: #eceafd; }
  .song-row.playing .song-name { color: var(--accent); }
  .song-no { width: 26px; text-align: center; color: #b3b8c6; font-size: 13px; flex: none; font-style: italic; }
  .song-row.playing .song-no { color: var(--accent); }
  .song-main { flex: 1; min-width: 0; }
  .song-name { font-size: calc(14px * var(--fs, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-meta .dot { margin: 0 6px; opacity: .5; }
  .badge {
    flex: none; font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: #eef0f7; color: #7a8199;
  }
  .badge.netease { background: #fdeaea; color: #d34a4a; }
  .badge.tencent { background: #e8f3fd; color: #3a7fd3; }
  .badge.kugou   { background: #e6f7ef; color: #2ba471; }
  .badge.kuwo    { background: #fff3e2; color: #d38b3a; }
  .badge.migu    { background: #eaeafd; color: #6a5ad3; }

  /* 行内操作按钮 */
  .row-acts { display: none; align-items: center; gap: 2px; flex: none; }
  .song-row:hover .row-acts { display: flex; }
  .row-acts button {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: #7a8199;
  }
  .row-acts button:hover { background: #e6e8f2; color: var(--accent); }
  .row-acts button.dl:hover { color: #2ba471; }
  .row-acts button.rm:hover { color: #d34a4a; }
  .song-row:hover .badge { display: none; }
  .row-acts .dl-ing { color: var(--accent); }

  /* 收藏浮层 */
  #pickMask {
    position: fixed; inset: 0; z-index: 90; display: none;
  }
  #pickMask.show { display: block; }
  #pickPop {
    position: fixed; z-index: 91; display: none;
    width: 230px; max-height: 320px; overflow-y: auto;
    background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(31,36,48,.18);
    padding: 8px; border: 1px solid var(--border);
  }
  #pickPop.show { display: block; }
  .pick-head { font-size: 12px; color: #9aa1b2; padding: 6px 10px 4px; }
  .pick-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: #454b59;
  }
  .pick-item:hover { background: #f1f2f9; }
  .pick-item .ok { margin-left: auto; color: var(--accent); font-weight: 700; }
  .pick-new {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--accent);
    border-top: 1px solid var(--border); margin-top: 4px;
  }
  .pick-new:hover { background: #f4f2ff; }
  .pick-empty { font-size: 12.5px; color: #b3b8c6; padding: 8px 10px; }

  .playall-btn {
    flex: none; font-size: 12.5px; padding: 7px 14px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: inline-flex; align-items: center; gap: 5px;
  }
  .playall-btn:hover { filter: brightness(1.08); }
  .import-btn {
    flex: none; font-size: 12.5px; padding: 7px 14px; border-radius: 16px;
    background: #eceafd; color: var(--accent);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .import-btn:hover { background: #e0ddfb; }

  /* ---------- 在线歌单（同步） ---------- */
  .sb-acct {
    display: flex; align-items: center; gap: 7px; padding: 7px 8px;
    border-radius: 9px; cursor: pointer; font-size: 13px; color: #454b59;
    transition: background .15s; flex: none;
  }
  .sb-acct:hover { background: #f1f2f9; }
  .sb-acct .caret {
    flex: none; width: 11px; color: #b3b8c6; font-size: 9px;
    transition: transform .15s; transform: rotate(0deg);
  }
  .sb-acct.open .caret { transform: rotate(90deg); }
  .sb-acct .avatar {
    flex: none; width: 21px; height: 21px; border-radius: 50%; object-fit: cover;
    background: #eceafd; display: grid; place-items: center;
    font-size: 10px; color: var(--accent); overflow: hidden;
  }
  .sb-acct .nick {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-weight: 600;
  }
  .sb-acct .pf {
    flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px;
    color: #fff; font-weight: 400;
  }
  .sb-acct .pf.netease { background: #e8443a; }
  .sb-acct .pf.tencent { background: #2bb673; }
  .sb-acct .acct-act {
    flex: none; width: 19px; height: 19px; border-radius: 5px; display: none;
    place-items: center; color: #9aa1b2; font-size: 12px; line-height: 1;
  }
  .sb-acct:hover .acct-act { display: grid; }
  .sb-acct .acct-act:hover { background: #e3e5ef; color: var(--text); }
  .sb-sub { padding-left: 4px; }
  .sb-sub .sb-item { font-size: calc(13px * var(--fs, 1)); padding: 7px 8px 7px 14px; }
  .sb-sub .sb-item .sb-name { color: #5b6170; font-weight: 400; }
  .sb-sub .sb-item.active .sb-name { color: var(--accent); font-weight: 600; }
  .sb-sub .sb-item .sb-count { font-size: calc(10.5px * var(--fs, 1)); }

  /* ---------- 同步弹窗 ---------- */
  #syncMask {
    position: fixed; inset: 0; z-index: 92; display: none;
    background: rgba(31,36,48,.30);
  }
  #syncMask.show { display: block; }
  #syncPop {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%,-50%);
    z-index: 93; display: none;
    width: min(370px, calc(100vw - 28px));
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 20px 56px rgba(31,36,48,.24); border: 1px solid var(--border);
  }
  #syncPop.show { display: block; }
  .sync-head { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .sync-sub { font-size: 12px; color: #9aa1b2; margin-bottom: 14px; line-height: 1.6; }
  .sync-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .sync-tab {
    flex: 1; padding: 9px 0; border-radius: 10px; font-size: 13px;
    color: #6b7280; background: #f4f5fa; transition: background .15s, color .15s;
  }
  .sync-tab:hover { background: #eceef5; }
  .sync-tab[data-pf="netease"].active { color: #d63a30; background: #fdecea; font-weight: 600; }
  .sync-tab[data-pf="tencent"].active { color: #148f5e; background: #e7f7f0; font-weight: 600; }
  .sync-input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 14px; outline: none; background: #fbfbfe;
    transition: border-color .15s, background .15s;
  }
  .sync-input:focus { border-color: var(--accent); background: #fff; }
  .sync-hint { font-size: 12px; color: #9aa1b2; line-height: 1.75; margin-top: 10px; }
  .sync-hint b { color: #6b7280; font-weight: 600; }
  .sync-hint code {
    background: #f4f5fa; border-radius: 4px; padding: 1px 5px;
    font-size: 11.5px; color: #5b6170;
  }
  .sync-foot { display: flex; gap: 10px; margin-top: 18px; }
  .sync-foot button { flex: 1; padding: 11px 0; border-radius: 10px; font-size: 14px; }
  .sync-cancel { background: #f4f5fa; color: #6b7280; }
  .sync-cancel:hover { background: #eceef5; }
  .sync-ok {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 600;
  }
  .sync-ok:hover { filter: brightness(1.08); }
  .sync-ok:disabled { opacity: .65; cursor: not-allowed; filter: none; }

  .empty-tip, .loading-tip {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9aa1b2; font-size: 14px; text-align: center; line-height: 2; pointer-events: none;
  }
  .empty-tip .big { font-size: 44px; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid #e3e6f0; border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .more-btn {
    display: block; margin: 8px auto 14px; padding: 8px 26px;
    border: 1px solid var(--border); border-radius: 18px; font-size: 13px; color: var(--text-2);
  }
  .more-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* 歌词 */
  .lyric-body { flex: 1; overflow-y: auto; padding: 24px 26px; position: relative; }
  .lyric-line {
    padding: 7px 4px; font-size: calc(14px * var(--fs, 1)); color: #8a90a3; line-height: 1.6;
    border-radius: 8px; cursor: pointer; transition: color .25s, transform .25s;
    transform-origin: left center;
  }
  .lyric-line:hover { color: var(--text); }
  .lyric-line.active { color: var(--accent); font-weight: 600; transform: scale(1.04); }
  .lyric-empty { color: #9aa1b2; text-align: center; padding-top: 40%; line-height: 2; }

  /* ---------- 播放条 ---------- */
  footer {
    flex: none; display: flex; align-items: center; gap: 18px;
    padding: 12px 22px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .cover-wrap { width: 58px; height: 58px; flex: none; border-radius: 12px; overflow: hidden; background: #eceef5; box-shadow: var(--shadow); }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-wrap svg { width: 100%; height: 100%; display: block; }
  .np-info { width: 190px; flex: none; min-width: 0; }
  .np-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 12px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .center-zone { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .ctrl-row { display: flex; align-items: center; gap: 14px; }
  .ctrl-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #5b6170; transition: all .15s; }
  .ctrl-btn:hover { background: #f1f2f9; color: var(--accent); }
  .ctrl-btn.mode { font-size: 11px; font-weight: 700; }
  .play-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(79,70,229,.35);
    transition: transform .15s;
  }
  .play-btn:hover { transform: scale(1.06); }
  .progress-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px; }
  .time { font-size: 11px; color: #9aa1b2; width: 40px; flex: none; text-align: center; font-variant-numeric: tabular-nums; }
  .progress-track {
    flex: 1; height: 5px; background: #e8eaf1; border-radius: 3px;
    position: relative; cursor: pointer; touch-action: none;   /* 触屏拖动时不被页面滚动打断 */
  }
  .progress-track::before { content: ""; position: absolute; inset: -8px 0; }
  .progress-track.dragging { cursor: grabbing; }
  .progress-track.dragging .progress-thumb {
    opacity: 1; transform: translate(-50%, -50%) scale(1.2);
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
  }
  .progress-thumb {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent);
    transform: translate(-50%, -50%); left: 0%; opacity: 0; transition: opacity .15s;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .progress-track:hover .progress-thumb { opacity: 1; }

  /* 宽度交给内容决定：固定 150px 装不下「下载 + 歌词 + 音量」，
   * 会让歌词按钮被挤成竖排文字、下载按钮被压扁（原有瑕疵） */
  .right-zone { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .vol-icon { color: #5b6170; flex: none; }
  .vol-slider { width: 90px; accent-color: var(--accent); height: 4px; cursor: pointer; }
  .lyric-toggle { font-size: 12px; padding: 7px 12px; border-radius: 17px; border: 1px solid var(--border); color: var(--text-2); }
  .lyric-toggle:hover, .lyric-toggle.on { color: var(--accent); border-color: var(--accent); }

  /* 提示气泡 */
  #toast {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: rgba(31,36,48,.88); color: #fff; font-size: 13px;
    padding: 9px 20px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 99; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
   * 移动端适配
   * 设计原则：
   *   1. 任何 ≥320px 的竖屏都不产生横向溢出（页面不做 viewport 缩放宽）
   *   2. 顶栏 / 播放条改为双行，把「宽元素」拆到独占行，不再互相挤压
   *   3. 触屏没有 hover → 操作按钮改为常显，不再依赖悬停
   *   4. 固定层（侧栏 / 歌词 / 提示）用实测栏高变量定位，不写死像素
   *   5. 刘海屏与 Home Indicator 由 env(safe-area-inset-*) 让位
   * ============================================================ */
  @media (max-width: 880px) {
    main { padding: 8px; gap: 8px; }
    .header-pad { display: none; }   /* 桌面用于左右平衡的占位块，窄屏必须撤掉 */

    /* 侧边栏：全屏抽屉（不再依赖硬编码的顶/底偏移） */
    .sidebar {
      position: fixed; inset: 0; width: 100%; z-index: 60;
      border-radius: 0; box-shadow: none;
      padding: 16px 12px;
      padding-top: max(16px, env(safe-area-inset-top, 0px));

<script>
"use strict";
/* ============================================================
 * 音乐播放器 · 阶段一（在线搜索 + 听歌）
 * 数据源：https://www.yinyueku.cn/api.php（JSONP）
 * 零依赖：原生 HTML/CSS/JS
 * ============================================================ */

/* API 端点常量定义在下方请求层（含 HTTPS/HTTP 两个地址，供降级使用） */
const PAGE_SIZE = 30;
const SOURCE_LABEL = { netease: "网易云", tencent: "QQ音乐", kugou: "酷狗", kuwo: "酷我", migu: "咪咕" };

/* ---------- 通用工具 ---------- */
const $ = (id) => document.getElementById(id);
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* ---------- API 请求层 ----------
 * 两种模式：
 *  A. 页面由本地代理服务（server.py）提供时（http/https 同源）→ fetch /api 代理转发，
 *     由代理忽略上游证书问题（当前站点 TLS 证书已过期）
 *  B. file:// 直接打开 → JSONP 直连站点；HTTPS 握手失败时自动降级到 HTTP（见下）
 *
 * 为什么需要降级：站点证书已过期（TrustAsia DV，notAfter 2025-08-12），
 * 浏览器会以 net::ERR_CERT_DATE_INVALID 直接拒绝 HTTPS 子资源。
 * 该站虽有 Strict-Transport-Security 响应头，但 HTTPS 从未成功访问过，
 * HSTS 并未写入生效 → HTTP 仍可正常返回数据。
 *
 * 降级原则（不写死 HTTP）：
 *   1. 一律先发 HTTPS；只有 HTTPS 确实失败、且页面自身不是 HTTPS
 *      （file:// 或 http://；HTTPS 页面加载 HTTP 子资源会被浏览器按混合内容拦截）
 *      才用 HTTP 重试，且仅重试一次；
 *   2. 站点证书一旦修复，HTTPS 首次尝试即成功，降级分支自然不会再执行 → 无技术债残留。
 */
const API_PATH = "/api.php";
const API_HTTPS = "https://www.yinyueku.cn" + API_PATH;
const API_HTTP = "http://www.yinyueku.cn" + API_PATH;
const PAGE_SECURE = location.protocol === "https:";
const PROXY_MODE = location.protocol === "http:" || location.protocol === "https:";

const JSONP_TIMEOUT = 15000;        // 常规超时
const JSONP_TIMEOUT_HTTPS = 8000;   // 首次 HTTPS 尝试的超时：失败时尽快让位给降级
let jsonpSeq = 0;                   // 回调名自增序号（严格模式下必须先声明）
let downgradeNotified = false;      // 降级提示只弹一次，避免每次请求都打扰

/* 单次 JSONP 尝试。
 * JSONP 没有状态码可读，失败只能靠 onerror 与超时识别：
 *   - settled 标志保证回调只结算一次（防止重复/延迟回调导致 Promise 二次触发）
 *   - 所有结算出口都执行 cleanup：清定时器、摘 script 节点、释放回调 → 请求不会悬挂 */
function jsonpOnce(baseUrl, params, timeout) {
  return new Promise((resolve, reject) => {
    const cbName = "__ym_cb_" + (++jsonpSeq) + "_" + Date.now();
    const script = document.createElement("script");
    let settled = false;
    const timer = setTimeout(() => finish(false, new Error("请求超时")), timeout);
    function cleanup() {
      clearTimeout(timer);
      script.onload = script.onerror = null;
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    function finish(ok, payload) {
      if (settled) return;   // 已结算：忽略迟到的 onerror / 重复回调
      settled = true;
      cleanup();
      if (ok) resolve(payload); else reject(payload);
    }
    window[cbName] = (data) => finish(true, data);
    script.onerror = () => finish(false, new Error("网络请求失败"));
    const qs = new URLSearchParams();
    qs.set("callback", cbName);
    for (const k in params) qs.set(k, params[k]);
    script.src = baseUrl + "?" + qs.toString();
    document.head.appendChild(script);
  });
}

/* 统一入口：先 HTTPS；确实失败且条件允许时才降级到 HTTP（仅一次） */
async function jsonpWithFallback(params) {
  try {
    return await jsonpOnce(API_HTTPS, params, JSONP_TIMEOUT_HTTPS);
  } catch (httpsErr) {
    if (PAGE_SECURE) {
      throw new Error("HTTPS 请求失败：" + httpsErr.message + "（HTTPS 页面不允许加载 HTTP 子资源，无法降级）");
    }
    try {
      const data = await jsonpOnce(API_HTTP, params, JSONP_TIMEOUT);
      if (!downgradeNotified) {
        downgradeNotified = true;
        // 延后到当前提示淡出后再显示，避免被"共找到 N 条"之类的即时提示覆盖
        setTimeout(() => toast("站点 HTTPS 证书已失效，已自动改用 HTTP 连接"), 2200);
      }
      return data;
    } catch (httpErr) {
      throw new Error("HTTPS 证书失效且 HTTP 也不可用：请检查本机网络能否访问 www.yinyueku.cn（证书拦截场景可改用本地代理服务中转）");
    }
  }
}

async function apiRequest(params) {
  if (PROXY_MODE) {
    const qs = new URLSearchParams();
    for (const k in params) qs.set(k, params[k]);
    const resp = await fetch("/api?" + qs.toString());
    const text = await resp.text();
    if (!resp.ok) throw new Error("代理服务异常 " + resp.status);
    try { return JSON.parse(text); }
    catch (e) { throw new Error("返回数据解析失败"); }
  }
  return jsonpWithFallback(params);
}

/* ---------- 在线歌单接口 ----------
 * 站点除 search / url / pic / lyric 外，另暴露两个接口用于同步"用户歌单"：
 *
 *   1) types=userlist & source=<netease|tencent> & uid=<网易云UID | QQ号>
 *      → { playlist: [ { id, name, trackCount|count, coverImgUrl, creator{nickname,avatarUrl} } ], more, code }
 *      · source 必带：source 缺省或写成别的值时，上游返回 HTML 信息页（非 JSON）；
 *      · uid 为空 / 含非数字字符 → { code:400, message:"请求参数错误" }；
 *      · 网易云 UID 不存在 → playlist 为空数组且 code=200（属正常"查无此人"，非报错）。
 *
 *   2) types=playlist & id=<歌单id> & source=<源>
 *      → 与 search 同构的歌曲数组（id/name/artist/album/pic_id/url_id/lyric_id/source/sign），
 *        可直接推入播放队列复用现有播放链路；sign 过期同样由 refreshSign 自愈。
 *      · source 必带：QQ 歌单不带 source 会得到空数组；
 *      · 上游单次最多返回 1000 首（limit 参数无效），超大歌单会截断。
 *
 * 实测（2026-09-18）：
 *   netease uid=123456 → 1 个歌单；tencent uid=123456 → "默认收藏" 23 首（实拉 22 首）
 */
const REMOTE_PLATFORMS = {
  netease: {
    label: "网易云",
    placeholder: "例如 123456",
    hint: '网页版网易云音乐 → 我的主页，地址栏中 <code>id=</code> 后面的数字就是 UID。',
    pattern: /^\d{1,20}$/,
    errText: "网易云 UID 应为纯数字",
    emptyText: "未找到该 UID 的公开歌单（可能不存在，或被设为隐私）",
  },
  tencent: {
    label: "QQ音乐",
    placeholder: "例如 10001",
    hint: "填入 QQ 号即可——QQ 音乐的「我喜欢」和自建歌单都挂在 QQ 账号下。",
    pattern: /^\d{1,20}$/,
    errText: "QQ 号应为纯数字",
    emptyText: "未找到该 QQ 号的公开歌单",
  },
};

/* 两平台字段名不同（netease.trackCount / tencent.count），统一成内部结构 */
function normalizeRemotePlaylist(p) {
  const creator = p.creator || {};
  let count = 0;
  if (typeof p.trackCount === "number") count = p.trackCount;
  else if (typeof p.count === "number") count = p.count;
  return {
    id: String(p.id),
    name: p.name || "未命名歌单",
    cover: p.coverImgUrl || "",
    count: count,
    playCount: typeof p.playCount === "number" ? p.playCount : 0,
    creator: creator.nickname || "",
    avatar: creator.avatarUrl || "",
  };
}

async function fetchUserPlaylists(platform, uid) {
  const data = await apiRequest({ types: "userlist", source: platform, uid: uid });
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    throw new Error("返回数据格式异常");
  }
  if (data.code && Number(data.code) !== 200) {
    throw new Error(data.message || data.msg || "请求参数错误");
  }
  const raw = Array.isArray(data.playlist) ? data.playlist : [];
  const playlists = raw.map(normalizeRemotePlaylist)
    .filter((p) => p.id && p.id !== "undefined" && p.id !== "null");
  return { more: !!data.more, playlists: playlists };
}

async function fetchRemotePlaylistSongs(platform, id) {
  const list = await apiRequest({ types: "playlist", id: id, source: platform });
  if (!Array.isArray(list)) throw new Error("返回数据格式异常");
  return list;
}

/* sign 机制：sign 随搜索结果下发且有时效，请求 url/pic/lyric 必须携带；
 * 失效时上游在字段里回"签名错误！"→ 自动重新搜索换取新 sign 并重试一次 */
function isSignError(x) { return typeof x === "string" && x.indexOf("签名错误") !== -1; }

async function refreshSign(song) {
  const artist0 = Array.isArray(song.artist) ? song.artist[0] : song.artist;
  const list = await apiRequest({
    types: "search", count: 10, pages: 1,
    name: (song.name || "") + " " + (artist0 || "")
  });
  if (!Array.isArray(list) || !list.length) throw new Error("刷新签名失败");
  const hit = list.find((s) => s.source === song.source && String(s.id) === String(song.id))
    || list.find((s) => s.source === song.source && s.name === song.name);
  if (!hit) throw new Error("刷新签名失败");
  song.sign = hit.sign;
  song.pic_id = hit.pic_id; song.url_id = hit.url_id; song.lyric_id = hit.lyric_id;
}

/* ---------- 全局状态 ---------- */

  remoteSongs: new Map(), // 会话内在线歌单歌曲缓存 sid:playlistId -> songs（不持久化，避免撑爆 localStorage）

/* ---------- 本地数据：歌单 / 最近播放 ---------- */
const sameSong = (a, b) => a.source === b.source && String(a.id) === String(b.id);

function songRefOf(song) {
  // 拷贝搜索结果字段（sign 随存；过期由 refreshSign 自愈）
  return {
    id: song.id, source: song.source, name: song.name,
    artist: song.artist, album: song.album,
    pic_id: song.pic_id, url_id: song.url_id, lyric_id: song.lyric_id, sign: song.sign
  };
}

function loadPlaylists() {
  try {
    const arr = JSON.parse(localStorage.getItem("ym_playlists") || "[]");
    state.playlists = Array.isArray(arr) ? arr : [];
  } catch (e) { state.playlists = []; }
}
function savePlaylists() {
  localStorage.setItem("ym_playlists", JSON.stringify(state.playlists));
  renderSidebar();
}
function loadRecent() {
  try {
    const arr = JSON.parse(localStorage.getItem("ym_recent") || "[]");
    state.recent = Array.isArray(arr) ? arr : [];
  } catch (e) { state.recent = []; }
}
function saveRecent() {
  localStorage.setItem("ym_recent", JSON.stringify(state.recent.slice(0, 50)));
}
function pushRecent(song) {
  state.recent = state.recent.filter((s) => !sameSong(s, song));
  state.recent.unshift(songRefOf(song));
  state.recent = state.recent.slice(0, 50);
  saveRecent();
  if (state.view.type === "recent") { renderList(); }
  renderSidebar();
}
function getPl(id) {
  return state.playlists.find((p) => p.id === id);
}

/* ---------- 在线歌单：账号持久化 ----------
 * 只持久化"账号 + 歌单目录"（体积小、变化慢），歌曲列表按需实时拉取并做会话内缓存：
 * 网易云大型歌单动辄上千首，全量塞进 localStorage 很快会触顶，且手机端配额更小。 */
function loadRemoteSources() {
  try {
    const arr = JSON.parse(localStorage.getItem("ym_remote_sources") || "[]");
    state.remoteSources = Array.isArray(arr) ? arr : [];
  } catch (e) { state.remoteSources = []; }
  state.remoteSources.forEach((s) => { if (!Array.isArray(s.playlists)) s.playlists = []; });
}
function saveRemoteSources() {
  try {
    localStorage.setItem("ym_remote_sources", JSON.stringify(state.remoteSources));
  } catch (e) {
    toast("在线歌单信息保存失败（本地存储空间不足）");
  }
}
function getRemoteSource(sid) {
  return state.remoteSources.find((s) => s.id === sid);
}
function remotePlaylistOf(view) {
  const src = getRemoteSource(view.sid);
  if (!src) return null;
  return src.playlists.find((p) => String(p.id) === String(view.rid)) || null;
}
/* 清空某个账号的歌单歌曲缓存（刷新/取消同步时调用，避免展示过期数据） */
function clearRemoteCache(sid) {
  const prefix = sid + ":";
  Array.from(state.remoteSongs.keys()).forEach((k) => {
    if (k.indexOf(prefix) === 0) state.remoteSongs.delete(k);
  });
}
function viewTitle() {
  const v = state.view;
  if (v.type === "search") return state.keyword ? "搜索：“" + state.keyword + "”" : "搜索结果";
  if (v.type === "recent") return "最近播放";
  if (v.type === "remote") {
    const pl = remotePlaylistOf(v);
    const src = getRemoteSource(v.sid);
    const pf = src && REMOTE_PLATFORMS[src.platform];
    return (pl ? pl.name : "在线歌单") + (pf ? " · " + pf.label : "");
  }
  const pl = getPl(v.id);
  return pl ? "歌单：" + pl.name : "歌单";
}

/* ---------- 搜索 ---------- */
async function doSearch(fresh) {
  const kw = $("searchInput").value.trim();
  if (!kw) { toast("请输入搜索内容"); return; }
  if (state.loading || state.loadingMore) return;

  if (fresh) {
    state.keyword = kw; state.page = 1; state.loading = true;
    state.view = { type: "search" };   // 搜索即切回搜索视图
    $("emptyTip").style.display = "none";
    showListLoading();
  } else {
    state.loadingMore = true;
    const btn = $("moreBtn"); if (btn) { btn.disabled = true; btn.textContent = "加载中…"; }
  }
  try {
    const list = await apiRequest({ types: "search", count: PAGE_SIZE, pages: state.page, name: state.keyword });
    if (!Array.isArray(list)) throw new Error("返回格式异常");
    if (fresh) state.results = [];
    state.lastCount = list.length;
    state.results = state.results.concat(list);
    state.page++;
    renderList();
    if (fresh && state.results.length) toast("共找到 " + state.results.length + " 条（可加载更多）");
  } catch (err) {
    toast("搜索失败：" + err.message);
    if (fresh) { state.results = []; renderList(); }
  } finally {
    state.loading = false; state.loadingMore = false;
  }
}

}

/* ---------- 视图切换 ---------- */
function currentViewSongs() {
  const v = state.view;
  if (v.type === "search") return state.results;
  if (v.type === "recent") return state.recent;
  if (v.type === "remote") return state.results;   // 在线歌单歌曲在打开时已装载进 results
  const pl = getPl(v.id);
  return pl ? pl.songs : [];
}

/* 离开搜索视图前留存结果：state.results 是"当前视图的播放队列"，切到别的视图会被覆写，
 * 不留档的话切回来就只剩别的视图的歌了（顺带修掉了原先切走再切回会串数据的旧问题）。 */
function rememberSearchSnapshot() {
  if (state.view.type === "search") {
    state.searchCache = {
      keyword: state.keyword,
      page: state.page,
      results: state.results,
      lastCount: state.lastCount,
    };
  }
}

function switchView(view) {
  rememberSearchSnapshot();
  state.view = view;
  state.page = 1;
  state.cur = -1;   // 视图切换不自动播放，索引重置
  if (view.type === "search") {
    if (state.searchCache) {
      state.keyword = state.searchCache.keyword;
      state.page = state.searchCache.page;
      state.results = state.searchCache.results;
      state.lastCount = state.searchCache.lastCount;
    } else {
      state.results = [];
    }
  } else {
    state.results = currentViewSongs();
  }
  renderList();
  renderSidebar();
}

/* ---------- 播放 ---------- */
async function fetchPlayUrl(song) {
  const key = songKey(song);
  if (state.urlCache.has(key)) return state.urlCache.get(key);
  const req = () => apiRequest({ types: "url", id: song.url_id || song.id, source: song.source, sign: song.sign || "" });
  let data = await req();
  if (data && isSignError(data.url)) {   // 签名过期：刷新后重试一次
    await refreshSign(song);
    data = await req();
  }
  const url = data && data.url;
  if (!url || url === "err" || isSignError(url)) throw new Error("该歌曲暂时无法播放");
  state.urlCache.set(key, url);
  return url;
}

async function playSong(i) {
  if (i < 0 || i >= state.results.length) return;
  const song = state.results[i];
  state.cur = i;
  state.consecutiveErr = 0;
  resetSeek();   // 切歌时进度条/拖动状态复位
  renderPlayingRow();
  updateNowPlaying(song);
  resetLyric();

  try {
    const url = await fetchPlayUrl(song);
    // 期间用户切换了歌曲则放弃
    if (state.cur !== i) return;
    audio.src = url;
    const p = audio.play();
    if (p) p.catch((err) => {
      if (err && err.name === "NotAllowedError") toast("浏览器拦截了自动播放，点击播放键开始");
      else toast("播放失败：" + (err && err.message ? err.message : "未知错误"));
    });
    pushRecent(song);   // 记录最近播放
    updatePlayIcon();
  } catch (err) {
    toast(song.name + "：" + err.message);
  }

  // 封面与歌词并行加载（不阻塞播放）
  loadCover(song);
  loadLyric(song);
}

function renderPlayingRow() {
  document.querySelectorAll(".song-row").forEach((row) => {
    row.classList.toggle("playing", Number(row.dataset.index) === state.cur);
  });
  const cur = document.querySelector('.song-row[data-index="' + state.cur + '"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function updateNowPlaying(song) {
  const artist = Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || "未知歌手");
  $("npName").textContent = song.name || "未知歌曲";
  $("npArtist").textContent = artist + (song.album ? " · " + song.album : "");
  document.title = song.name + " - " + artist + " | 音乐播放器";
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name || "", artist: artist, album: song.album || ""
    });
  }
}

/* ---------- 封面 ---------- */
async function loadCover(song) {
  const wrap = $("coverWrap");
  const fallback = '<svg viewBox="0 0 24 24" fill="#c3c8d6"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
  try {
    const req = () => apiRequest({ types: "pic", id: song.pic_id || "", source: song.source, song: song.id, sign: song.sign || "" });
    let data = await req();
    if (data && isSignError(data.url)) {
      await refreshSign(song);
      data = await req();
    }
    const url = data && data.url;
    if (state.cur !== state.results.indexOf(song)) return;
    if (!url || !/^https?:/.test(url)) { wrap.innerHTML = fallback; return; }
    wrap.innerHTML = "";
    const img = new Image();
    img.src = url; img.alt = "封面";
    img.onerror = () => { wrap.innerHTML = fallback; };
    wrap.appendChild(img);
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name || "",
          artist: Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || ""),
          album: song.album || "",
          artwork: [{ src: url, sizes: "300x300", type: "image/jpeg" }]
        });
      } catch (e) {}
    }
  } catch (e) { wrap.innerHTML = fallback; }
}

/* ---------- 歌词 ---------- */
function parseLrc(text) {
  const lines = []; let offset = 0;
  const om = text.match(/\[offset:\s*(-?\d+)\s*\]/i);
  if (om) offset = parseInt(om[1], 10) / 1000;
  const rowRe = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/g;
  for (const raw of text.split(/\r?\n/)) {
    rowRe.lastIndex = 0;
    let m, times = [];
    while ((m = rowRe.exec(raw))) {
      let t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      if (m[3]) t += parseInt(m[3].padEnd(3, "0"), 10) / 1000;
      times.push(t);
    }
    if (!times.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const t of times) lines.push({ t: t, text: txt });
  }
  lines.sort((a, b) => a.t - b.t);
  return { lines: lines, offset: offset };
}

function resetLyric() {
  state.lyric = { lines: [], idx: -1, offset: 0 };
  $("lyricLines").innerHTML = "";
  $("lyricEmpty").style.display = "";
  $("lyricEmpty").textContent = "歌词加载中…";
}

async function loadLyric(song) {
  resetLyric();
  try {
    const req = () => apiRequest({ types: "lyric", id: song.lyric_id || song.id, source: song.source, song: song.id, sign: song.sign || "" });
    let data = await req();
    if (data && isSignError(data.lyric)) {
      await refreshSign(song);
      data = await req();
    }
    if (state.cur !== state.results.indexOf(song)) return;  // 期间已切歌，丢弃
    const text = data && data.lyric;
    if (!text || /签名错误|错误/.test(text) || !/\[\d{1,2}:\d{1,2}/.test(text)) {
      $("lyricEmpty").textContent = "暂无歌词";
      return;
    }
    state.lyric = parseLrc(text);
    state.lyric.idx = -1;
    const box = $("lyricLines");
    box.innerHTML = state.lyric.lines
      .map((l, i) => '<div class="lyric-line" data-i="' + i + '">' + (l.text ? esc(l.text) : "<br>") + "</div>")
      .join("");
    $("lyricEmpty").style.display = "none";
    box.querySelectorAll(".lyric-line").forEach((el) => {
      el.addEventListener("click", () => {
        const line = state.lyric.lines[Number(el.dataset.i)];
        if (line && isFinite(audio.duration)) audio.currentTime = Math.max(0, line.t - state.lyric.offset);
      });
    });
    syncLyric(true);
  } catch (e) {
    if (state.cur === state.results.indexOf(song)) $("lyricEmpty").textContent = "暂无歌词";
  }
}

function syncLyric(force) {
  const L = state.lyric;
  if (!L.lines.length) return;
  const t = audio.currentTime + L.offset;
  let idx = -1;
  // 从上次位置附近查找，避免每秒全表扫描
  const start = Math.max(0, L.idx);
  for (let i = start; i < L.lines.length; i++) {
    if (L.lines[i].t <= t) idx = i; else break;
  }
  if (idx === -1) {
    for (let i = 0; i < L.lines.length; i++) {
      if (L.lines[i].t <= t) idx = i; else break;
    }
  }
  if (idx === L.idx && !force) return;
  L.idx = idx;
  const box = $("lyricLines");
  const prev = box.querySelector(".lyric-line.active");
  if (prev) prev.classList.remove("active");
  if (idx >= 0) {
    const el = box.children[idx];
    if (el) {
      el.classList.add("active");
      const body = $("lyricBody");
      const target = el.offsetTop - body.clientHeight / 2 + el.clientHeight / 2;
      body.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    }
  }
}

/* ---------- 下载（前端 blob，失败降级新标签） ---------- */
function sanitizeName(s) {
  return String(s).replace(/[\\/:*?"<>|\r\n]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 120);
}

async function downloadSong(song, btn) {
  const key = songKey(song);
  if (state.downloading.has(key)) { toast("该歌曲正在下载中"); return; }
  state.downloading.add(key);
  if (btn) btn.classList.add("dl-ing");
  try {
    const url = await fetchPlayUrl(song);
    let ok = false;
    try {
      const resp = await fetch(url);   // 依赖 mp3 CDN 的 CORS 放行
      if (resp.ok) {
        const blob = await resp.blob();
        const artist = Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || "");
        const a = document.createElement("a");
        const objUrl = URL.createObjectURL(blob);
        a.href = objUrl;
        a.download = sanitizeName(song.name + " - " + artist) + ".mp3";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 30000);
        ok = true;
        toast("已开始下载：" + song.name);
      }
    } catch (e) { /* CORS 或网络失败 → 降级 */ }
    if (!ok) {
      window.open(url, "_blank");
      toast("浏览器无法直接保存，已在新标签打开，请按 Ctrl+S 另存");
    }
  } catch (err) {
    toast("下载失败：" + err.message);
  } finally {
    state.downloading.delete(key);
    if (btn) btn.classList.remove("dl-ing");
  }
}

/* ---------- 在线歌单：同步 / 打开 / 导入 ---------- */
let syncPlatform = "netease";   // 弹窗当前选中的平台
let syncing = false;            // 同步请求进行中（防重复提交）

/* 把一次接口结果落到 state.remoteSources（新增或覆盖），并刷新侧边栏 */
function applySyncResult(platform, uid, playlists) {
  const sid = platform + "_" + uid;
  const src = getRemoteSource(sid);
  const first = playlists[0] || {};
  const meta = {
    id: sid,
    platform: platform,
    uid: uid,
    nickname: first.creator || uid,   // 同一账号下各歌单的 creator 相同，取首个即可
    avatar: first.avatar || "",
    playlists: playlists,
    expanded: src ? src.expanded !== false : true,
    fetchedAt: Date.now(),
  };
  if (src) Object.assign(src, meta);
  else state.remoteSources.push(meta);
  saveRemoteSources();
  renderSidebar();
  return sid;
}

/* ---- 同步弹窗 ---- */
function renderSyncDialog() {
  const pf = REMOTE_PLATFORMS[syncPlatform];
  document.querySelectorAll(".sync-tab").forEach((b) => {
    b.classList.toggle("active", b.dataset.pf === syncPlatform);
  });
  $("syncInput").placeholder = pf.placeholder;
  $("syncHint").innerHTML = pf.hint;
}

function openSyncDialog() {
  syncPlatform = "netease";
  $("syncInput").value = "";
  renderSyncDialog();
  $("syncMask").classList.add("show");
  $("syncPop").classList.add("show");
  setTimeout(() => { try { $("syncInput").focus(); } catch (e) {} }, 60);
}

function closeSyncDialog() {
  $("syncMask").classList.remove("show");
  $("syncPop").classList.remove("show");
}

async function submitSync() {
  if (syncing) return;
  const pf = REMOTE_PLATFORMS[syncPlatform];
  const uid = $("syncInput").value.trim();
  if (!uid) { toast("请输入" + pf.placeholder.replace("例如 ", "")); return; }
  if (!pf.pattern.test(uid)) { toast(pf.errText); return; }

  syncing = true;
  const okBtn = $("syncOk");
  okBtn.disabled = true;
  okBtn.textContent = "同步中…";
  try {
    const res = await fetchUserPlaylists(syncPlatform, uid);
    if (!res.playlists.length) { toast(pf.emptyText); return; }   // 不关窗，方便直接改
    const sid = syncPlatform + "_" + uid;
    const existed = !!getRemoteSource(sid);
    applySyncResult(syncPlatform, uid, res.playlists);
    const src = getRemoteSource(sid);
    closeSyncDialog();
    toast((existed ? "已更新「" : "已同步「") + (src.nickname || uid) + "」的 " + res.playlists.length + " 个歌单");
  } catch (err) {
    toast("同步失败：" + err.message);
  } finally {
    syncing = false;
    okBtn.disabled = false;
    okBtn.textContent = "同步";
  }
}

/* ---- 打开在线歌单：歌曲按需拉取 + 会话内缓存 ---- */
async function openRemotePlaylist(sid, rid) {
  const src = getRemoteSource(sid);
  if (!src) return;
  rid = String(rid);
  const pl = src.playlists.find((p) => String(p.id) === rid);
  rememberSearchSnapshot();
  state.view = { type: "remote", sid: sid, rid: rid };
  state.cur = -1;
  state.page = 1;
  renderRemoteSources();
  closeSidebarIfMobile();

  const key = sid + ":" + rid;
  if (state.remoteSongs.has(key)) {     // 本次会话已拉过 → 不再打网络
    state.results = state.remoteSongs.get(key);
    renderList();
    return;
  }

  // 拉取中：用 loading 占住列表面板（renderList 会清掉 loadingTip，所以这一段不走它）
  state.results = [];
  $("emptyTip").style.display = "none";
  $("songList").innerHTML = "";
  const oldTip = $("loadingTip"); if (oldTip) oldTip.remove();
  $("listBody").insertAdjacentHTML("beforeend",
    '<div class="loading-tip" id="loadingTip"><div><div class="spinner"></div>正在拉取歌单…</div></div>');
  $("listTitle").textContent = viewTitle();
  $("listCount").textContent = "";
  $("playAllBtn").style.display = "none";
  $("importBtn").style.display = "none";

  try {
    const songs = await fetchRemotePlaylistSongs(src.platform, rid);
    // 期间用户可能已切到别的视图：丢弃这次结果
    if (state.view.type !== "remote" || state.view.sid !== sid || state.view.rid !== rid) return;
    state.remoteSongs.set(key, songs);
    // 用实拉数量回填：QQ 端给出的 count 常不准（实测 23 → 实拉 22）
    if (pl && songs.length && pl.count !== songs.length) {
      pl.count = songs.length;
      saveRemoteSources();
      renderRemoteSources();
    }
    state.results = songs;
    renderList();
    if (songs.length) {
      toast(songs.length >= 1000
        ? "已载入 1000 首（上游单次上限，更长的歌单仅取前 1000 首）"
        : "已载入 " + songs.length + " 首");
    }
  } catch (err) {
    if (state.view.type === "remote" && state.view.sid === sid) {
      state.results = [];
      renderList();
      toast("歌单加载失败：" + err.message);
    }
  }
}

/* ---- 账号操作：重新同步 / 取消同步 ---- */
async function refreshRemoteAccount(sid) {
  const src = getRemoteSource(sid);
  if (!src || syncing) return;
  syncing = true;
  const who = src.nickname || src.uid;
  toast("正在重新同步「" + who + "」…");
  try {
    const res = await fetchUserPlaylists(src.platform, src.uid);
    if (!res.playlists.length) { toast("未取到歌单，已保留原有数据"); return; }
    clearRemoteCache(sid);
    applySyncResult(src.platform, src.uid, res.playlists);
    if (state.view.type === "remote" && state.view.sid === sid) {
      openRemotePlaylist(sid, state.view.rid);   // 正看着该账号的歌单 → 重新拉一遍
    }
    const fresh = getRemoteSource(sid);
    toast("已更新「" + (fresh.nickname || src.uid) + "」的 " + res.playlists.length + " 个歌单");
  } catch (err) {
    toast("同步失败：" + err.message);
  } finally {
    syncing = false;
  }
}

function removeRemoteAccount(sid) {
  const src = getRemoteSource(sid);
  if (!src) return;
  const who = src.nickname || src.uid;
  if (!window.confirm("取消同步「" + who + "」？\n\n只移除侧边栏里的在线歌单，本地歌单与已收藏的歌曲不受影响。")) return;
  state.remoteSources = state.remoteSources.filter((s) => s.id !== sid);
  saveRemoteSources();
  clearRemoteCache(sid);
  if (state.view.type === "remote" && state.view.sid === sid) switchView({ type: "search" });
  else renderSidebar();
  toast("已取消同步「" + who + "」");
}

/* ---- 整个在线歌单导入为我的歌单 ---- */
function importCurrentRemote() {
  const v = state.view;
  if (v.type !== "remote" || !state.results.length) return;
  const pl = remotePlaylistOf(v);
  const base = (pl ? pl.name : "在线歌单").trim() || "在线歌单";
  let name = base, n = 1;
  while (state.playlists.some((p) => p.name === name)) { name = base + " (" + (++n) + ")"; }
  if (!window.confirm("把「" + base + "」的 " + state.results.length + " 首歌曲导入为我的歌单「" + name + "」？\n\n导入后即为本地歌单，可长期保留、随时播放。")) return;
  const local = createPlaylist(name);
  local.songs = state.results.map(songRefOf);
  savePlaylists();
  toast("已导入 " + local.songs.length + " 首到「" + name + "」");
  switchView({ type: "playlist", id: local.id });
}

/* ---------- 歌单管理 ---------- */
function createPlaylist(name) {
  const pl = { id: "pl_" + Date.now() + "_" + Math.floor(Math.random() * 1e4), name: name, createdAt: Date.now(), songs: [] };
  state.playlists.push(pl);
  savePlaylists();
  return pl;
}

function promptNewPlaylist(thenAdd) {
  const name = (window.prompt("歌单名称：") || "").trim();
  if (!name) return;
  if (state.playlists.some((p) => p.name === name)) { toast("已有同名歌单"); return; }
  const pl = createPlaylist(name);
  toast("歌单「" + name + "」已创建");
  if (thenAdd) addToPlaylist(thenAdd, pl.id);
}

function showPlMenu(e, pid) {
  e.stopPropagation();
  const pl = getPl(pid);
  if (!pl) return;
  const act = window.prompt("歌单「" + pl.name + "」操作，输入序号：\n1. 重命名\n2. 删除歌单");
  if (act === "1") {
    const name = (window.prompt("新的歌单名称：", pl.name) || "").trim();
    if (!name) return;
    pl.name = name;
    savePlaylists();
    renderList();   // 当前若在该歌单视图，同步标题
    toast("已重命名为「" + name + "」");
  } else if (act === "2") {
    if (!window.confirm("确定删除歌单「" + pl.name + "」？（共 " + pl.songs.length + " 首，不可恢复）")) return;
    state.playlists = state.playlists.filter((p) => p.id !== pid);
    savePlaylists();
    if (state.view.type === "playlist" && state.view.id === pid) switchView({ type: "search" });
    else renderSidebar();
    toast("歌单已删除");
  }
}

/* ---------- 收藏浮层 ---------- */
let pickSong = null;
function openPick(song, btn) {
  pickSong = song;
  const pop = $("pickPop"), mask = $("pickMask");
  let html = '<div class="pick-head">收藏「' + esc(song.name) + "」到：</div>";
  if (!state.playlists.length) {
    html += '<div class="pick-empty">还没有歌单，先新建一个吧</div>';
  } else {
    html += state.playlists.map((p) => {
      const has = p.songs.some((s) => sameSong(s, song));
      return '<div class="pick-item" data-pl="' + esc(p.id) + '">' +
        '<span>' + esc(p.name) + '</span><span class="sb-count">' + p.songs.length + "</span>" +
        (has ? '<span class="ok">✓已收</span>' : "") + "</div>";
    }).join("");
  }
  html += '<div class="pick-new" id="pickNew">＋ 新建歌单并加入</div>';
  pop.innerHTML = html;
  pop.querySelectorAll(".pick-item").forEach((el) => {
    el.addEventListener("click", () => { addToPlaylist(pickSong, el.dataset.pl); closePick(); });
  });
  pop.querySelector("#pickNew").addEventListener("click", () => { promptNewPlaylist(pickSong); closePick(); });
  // 定位：按钮左侧弹出，贴屏幕边缘则回退
  const r = btn.getBoundingClientRect();
  pop.classList.add("show");
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = r.left - pw - 6, y = Math.min(r.top, window.innerHeight - ph - 12);
  if (x < 8) x = Math.min(r.right + 6, window.innerWidth - pw - 8);
  pop.style.left = x + "px";
  pop.style.top = Math.max(8, y) + "px";
  mask.classList.add("show");
}
function closePick() {
  $("pickPop").classList.remove("show");
  $("pickMask").classList.remove("show");
  pickSong = null;
}
$("pickMask").addEventListener("click", closePick);

function addToPlaylist(song, pid) {
  if (!song) return;
  const pl = getPl(pid);
  if (!pl) return;
  if (pl.songs.some((s) => sameSong(s, song))) { toast("已在歌单「" + pl.name + "」中"); return; }
  pl.songs.push(songRefOf(song));
  savePlaylists();
  toast("已收藏到「" + pl.name + "」");
  if (state.view.type === "playlist" && state.view.id === pid) renderList();
}

function removeFromPlaylist(song) {
  const v = state.view;
  if (v.type !== "playlist") return;
  const pl = getPl(v.id);
  if (!pl) return;
  pl.songs = pl.songs.filter((s) => !sameSong(s, song));
  savePlaylists();
  state.results = pl.songs;
  // 若移除的是正在播放的歌，只更新高亮显示，不打断播放
  if (state.cur >= pl.songs.length) state.cur = -1;
  renderList();
  toast("已从「" + pl.name + "」移除");
}

/* ---------- 侧边栏 / 抽屉 ---------- */
function closeSidebarIfMobile() {
  if (window.innerWidth <= 880) $("sidebar").classList.remove("open");
}

$("menuBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  $("sidebar").classList.toggle("open");
});
$("sbClose").addEventListener("click", closeSidebarIfMobile);
document.addEventListener("click", (e) => {
  const sb = $("sidebar");
  if (sb.classList.contains("open") && !e.target.closest("#sidebar") && !e.target.closest("#menuBtn")) {
    closeSidebarIfMobile();
  }
});

/* ---------- 播放控制 ---------- */
function nextIndex(dir, auto) {
  const n = state.results.length;
  if (!n) return -1;
  if (state.mode === "loop" && auto) return state.cur;
  if (state.mode === "shuffle") {
    if (n === 1) return 0;
    let r; do { r = Math.floor(Math.random() * n); } while (r === state.cur);
    return r;
  }
  return (state.cur + dir + n) % n;
}

function playNext(dir, auto) {
  const i = nextIndex(dir, auto);
  if (i >= 0) playSong(i);
  else toast("列表为空，先搜索几首歌吧");
}

function updatePlayIcon() {
  const playing = !audio.paused;
  $("iconPlay").style.display = playing ? "none" : "";
  $("iconPause").style.display = playing ? "" : "none";
}

/* ---------- 进度条 ----------
 * 拖动采用"预览 + 提交"两段式：
 *  按下/移动 → 仅更新滑块与时间显示（不触碰音频，避免连续 seek 卡顿）
 *  松开     → 一次性 seek 到目标位置，从该处继续播放
 */
function updateProgress() {
  if (state.seek.active) return;   // 拖动中显示由 seekPreview 接管
  const d = audio.duration || 0, t = audio.currentTime || 0;
  const pct = d ? (t / d) * 100 : 0;
  $("progressFill").style.width = pct + "%";
  $("progressThumb").style.left = pct + "%";
  $("curTime").textContent = fmtTime(t);
  $("durTime").textContent = fmtTime(d);
  $("progressTrack").setAttribute("aria-valuenow", Math.round(pct));
  syncLyric(false);
}

function seekPreview(ratio) {
  state.seek.ratio = ratio;
  const d = audio.duration || 0;
  const pct = (ratio * 100).toFixed(2) + "%";
  $("progressFill").style.width = pct;
  $("progressThumb").style.left = pct;
  $("curTime").textContent = fmtTime(ratio * d);   // 时间跟随滑块；总时长不变
}

function commitSeek(ratio) {
  const d = audio.duration;
  if (!isFinite(d) || d <= 0) { updateProgress(); return; }
  let t = ratio * d;
  if (t >= d - 0.25) t = Math.max(0, d - 0.25);   // 拖到结尾：留 0.25s 缓冲，播完自然切下一首
  audio.currentTime = t;
  updateProgress();   // 松手后恢复实时更新，并立即显示落点
}

function resetSeek() {
  state.seek.active = false;
  $("progressTrack").classList.remove("dragging");
}

function bindProgress() {
  const track = $("progressTrack");
  const ratioOf = (e) => {
    const rect = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - rect.left) / (rect.width || 1)));
  };
  track.addEventListener("pointerdown", (e) => {
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) { toast("歌曲还未加载完成，暂时不能拖动进度"); return; }
    state.seek.active = true;
    track.classList.add("dragging");
    try { track.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件等场景忽略 */ }
    seekPreview(ratioOf(e));
  });
  track.addEventListener("pointermove", (e) => {
    if (!state.seek.active) return;
    seekPreview(ratioOf(e));
  });
  const endDrag = () => {
    if (!state.seek.active) return;
    state.seek.active = false;
    track.classList.remove("dragging");
    commitSeek(state.seek.ratio);
  };
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);   // 触屏被系统手势打断等情况
  // 键盘可访问性：聚焦后 ←/±5s
  track.tabIndex = 0;
  track.setAttribute("role", "slider");
  track.setAttribute("aria-label", "播放进度");
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", "100");
  track.addEventListener("keydown", (e) => {
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    if (e.key === "ArrowRight") {
      e.preventDefault();
      commitSeek(Math.min(1, (audio.currentTime + 5) / d));
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      commitSeek(Math.max(0, (audio.currentTime - 5) / d));
    }
  });
}

/* ---------- 事件绑定 ---------- */
$("searchBtn").addEventListener("click", () => doSearch(true));
$("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(true); });

$("playBtn").addEventListener("click", () => {
  if (state.cur < 0) { if (state.results.length) playSong(0); else toast("先搜索并点一首歌"); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});

$("prevBtn").addEventListener("click", () => playNext(-1, false));
$("nextBtn").addEventListener("click", () => playNext(1, false));
bindProgress();   // 进度条：点击/拖动/键盘（含预览-提交两段式逻辑）

const MODE_TEXT = { order: "顺序", loop: "单曲", shuffle: "随机" };
function applyMode() {
  $("modeBtn").textContent = MODE_TEXT[state.mode] || "顺序";
  localStorage.setItem("ym_mode", state.mode);
}
$("modeBtn").addEventListener("click", () => {
  state.mode = state.mode === "order" ? "loop" : state.mode === "loop" ? "shuffle" : "order";
  applyMode();
  toast("播放模式：" + (MODE_TEXT[state.mode] || "顺序"));
});
applyMode();

const vol = $("volSlider");
vol.value = Math.round(audio.volume * 100);
vol.addEventListener("input", () => {
  audio.volume = vol.value / 100;
  localStorage.setItem("ym_vol", String(vol.value));
});

$("lyricToggle").addEventListener("click", () => {
  const p = $("lyricPanel");
  p.classList.toggle("show");
  $("lyricToggle").classList.toggle("on", p.classList.contains("show"));
});

/* 在线歌单：同步入口 / 弹窗交互 / 整单导入 */
$("syncBtn").addEventListener("click", (e) => { e.stopPropagation(); openSyncDialog(); });
$("syncMask").addEventListener("click", closeSyncDialog);
$("syncCancel").addEventListener("click", closeSyncDialog);
$("syncOk").addEventListener("click", submitSync);
$("syncInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitSync(); });
$("importBtn").addEventListener("click", importCurrentRemote);
document.querySelectorAll(".sync-tab").forEach((b) => {
  b.addEventListener("click", () => { syncPlatform = b.dataset.pf; renderSyncDialog(); });
});

/* 歌单 / 视图 / 下载 */
$("navRecent").addEventListener("click", () => { switchView({ type: "recent" }); closeSidebarIfMobile(); });
$("newPlBtn").addEventListener("click", (e) => { e.stopPropagation(); promptNewPlaylist(); });
$("playAllBtn").addEventListener("click", () => {
  if (state.results.length) playSong(0);
});
$("dlBtn").addEventListener("click", () => {
  if (state.cur < 0 || !state.results[state.cur]) { toast("当前没有正在播放的歌曲"); return; }
  downloadSong(state.results[state.cur], $("dlBtn"));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeSyncDialog(); closePick(); closeSidebarIfMobile(); return; }
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("playBtn").click(); }
});

/* ---------- audio 事件 ---------- */
audio.addEventListener("play", updatePlayIcon);
audio.addEventListener("pause", updatePlayIcon);
audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("durationchange", updateProgress);
audio.addEventListener("playing", () => { state.consecutiveErr = 0; });
audio.addEventListener("ended", () => playNext(1, true));
audio.addEventListener("error", () => {
  if (!audio.src || state.cur < 0) return;
  state.consecutiveErr++;
  if (state.consecutiveErr >= 3) {
    toast("连续多首播放失败，请检查网络后重试");
    state.consecutiveErr = 0;
    return;
  }
  toast("当前歌曲播放失败，自动切换下一首");
  playNext(1, true);
});

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack", () => playNext(-1, false));
    navigator.mediaSession.setActionHandler("nexttrack", () => playNext(1, false));
  } catch (e) {}
}

/* ---------- 字体大小（歌单标题 / 歌名 / 歌词，共 20 档，可持久化） ---------- */
// 只缩放指定文本，不缩放整体 UI：通过 CSS 变量 --fs 调整相关元素的 font-size
// （歌单标题 #listTitle、歌名 .song-name、歌词 .lyric-line、侧边栏 .sb-* 均用 calc(基础px * var(--fs))），
// 其余 UI 保持固定不变；持久化档位到 localStorage。
const FS_LEVELS = [0.85, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2, 1.25, 1.3,
                   1.35, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2];
const FS_DEFAULT = 3; // 默认第 4 档（1.0，正常大小）
let fsLevel = (() => {
  const s = parseInt(localStorage.getItem("ym_fs_level"), 10);
  return (isFinite(s) && s >= 0 && s < FS_LEVELS.length) ? s : FS_DEFAULT;
})();
function applyFs() {
  document.documentElement.style.setProperty("--fs", String(FS_LEVELS[fsLevel]));
  const val = $("fsVal");
  if (val) val.textContent = (fsLevel + 1) + "/" + FS_LEVELS.length;
}
function setFsLevel(l) {
  fsLevel = Math.max(0, Math.min(FS_LEVELS.length - 1, l));
  applyFs();
  localStorage.setItem("ym_fs_level", String(fsLevel));
}
$("fsMinus").addEventListener("click", () => setFsLevel(fsLevel - 1));
$("fsPlus").addEventListener("click", () => setFsLevel(fsLevel + 1));
applyFs();

/* ---------- 移动端：实测顶栏 / 播放条高度 ----------
 * 侧边栏、歌词面板、提示气泡都是固定定位，需要知道上下两条栏的真实高度。
 * 移动端双行布局下栏高会随内容、字号、安全区变化，写死像素必然错位，
 * 因此实测后写入 CSS 变量 --hdr-h / --ftr-h，由样式表引用。 */
function syncBars() {
  const h = document.querySelector("header");
  const f = document.querySelector("footer");
  if (!h || !f) return;
  const root = document.documentElement.style;
  root.setProperty("--hdr-h", Math.round(h.getBoundingClientRect().height) + "px");
  root.setProperty("--ftr-h", Math.round(f.getBoundingClientRect().height) + "px");
}
if ("ResizeObserver" in window) {
  const ro = new ResizeObserver(syncBars);
  ro.observe(document.querySelector("header"));
  ro.observe(document.querySelector("footer"));
} else {
  window.addEventListener("resize", syncBars);
}
window.addEventListener("orientationchange", () => setTimeout(syncBars, 150));
window.addEventListener("load", syncBars);
syncBars();

/* ---------- 初始化 ---------- */
loadPlaylists();
loadRecent();
loadRemoteSources();
renderSidebar();
renderList();
</script>
</body>
