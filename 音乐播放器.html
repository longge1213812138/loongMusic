<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --bg: #f5f6fa;
    --panel: #ffffff;
    --text: #1f2430;
    --text-2: #6b7280;
    --border: #e8eaf1;
    --shadow: 0 4px 16px rgba(31,36,48,.06);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "MiSans", "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d4d8e4; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #b9bfd2; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; flex: none; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff;
  }
  .search-box { display: flex; flex: 1; max-width: 560px; margin: 0 auto; }
  .search-box input {
    flex: 1; height: 42px; padding: 0 18px;
    border: 1px solid var(--border); border-right: none;
    border-radius: 21px 0 0 21px; outline: none;
    font-size: 14px; background: var(--bg);
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    height: 42px; padding: 0 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-radius: 0 21px 21px 0; font-size: 14px;
  }
  .search-box button:hover { filter: brightness(1.08); }
  .header-pad { flex: none; width: 130px; }
  .menu-btn {
    display: none; width: 36px; height: 36px; border-radius: 10px; flex: none;
    place-items: center; color: #5b6170;
  }
  .menu-btn:hover { background: #f1f2f9; }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    flex: none; width: 190px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 10px; gap: 4px; overflow-y: auto;
  }
  .sb-title {
    font-size: 12px; color: #9aa1b2; padding: 8px 10px 4px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sb-new {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    color: #9aa1b2; font-size: 15px; line-height: 1;
  }
  .sb-new:hover { background: #f1f2f9; color: var(--accent); }
  .sb-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 9px; cursor: pointer; font-size: 13.5px; color: #454b59;
    transition: background .15s; position: relative; flex: none;
  }
  .sb-item:hover { background: #f1f2f9; }
  .sb-item.active { background: #eceafd; color: var(--accent); font-weight: 600; }
  .sb-item .sb-icon { flex: none; display: grid; place-items: center; color: #9aa1b2; width: 18px; }
  .sb-item.active .sb-icon { color: var(--accent); }
  .sb-item .sb-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-item .sb-count { font-size: 11px; color: #b3b8c6; flex: none; }
  .sb-item .sb-more {
    flex: none; width: 22px; height: 22px; border-radius: 6px;
    display: none; place-items: center; color: #9aa1b2; font-size: 15px; letter-spacing: 1px;
  }
  .sb-item:hover .sb-more { display: grid; }
  .sb-item .sb-more:hover { background: #e3e5ef; color: var(--text); }
  .sb-empty { font-size: 12px; color: #b3b8c6; padding: 6px 10px; line-height: 1.8; }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: flex; min-height: 0; padding: 16px 22px; gap: 16px; }
  .panel {
    background: var(--panel); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0;
  }
  .list-panel { flex: 1.25; min-width: 0; }
  .lyric-panel { flex: 1; min-width: 0; display: none; }
  .lyric-panel.show { display: flex; }
  .panel-head {
    flex: none; padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-head .sub { font-size: 12px; color: var(--text-2); font-weight: 400; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px 10px; position: relative; }

  /* 歌曲行 */
  .song-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; cursor: pointer;
    transition: background .15s;
  }
  .song-row:hover { background: #f1f2f9; }
  .song-row.playing { background: #eceafd; }
  .song-row.playing .song-name { color: var(--accent); }
  .song-no { width: 26px; text-align: center; color: #b3b8c6; font-size: 13px; flex: none; font-style: italic; }
  .song-row.playing .song-no { color: var(--accent); }
  .song-main { flex: 1; min-width: 0; }
  .song-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-meta { font-size: 12px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-meta .dot { margin: 0 6px; opacity: .5; }
  .badge {
    flex: none; font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: #eef0f7; color: #7a8199;
  }
  .badge.netease { background: #fdeaea; color: #d34a4a; }
  .badge.tencent { background: #e8f3fd; color: #3a7fd3; }
  .badge.kugou   { background: #e6f7ef; color: #2ba471; }
  .badge.kuwo    { background: #fff3e2; color: #d38b3a; }
  .badge.migu    { background: #eaeafd; color: #6a5ad3; }

  /* 行内操作按钮 */
  .row-acts { display: none; align-items: center; gap: 2px; flex: none; }
  .song-row:hover .row-acts { display: flex; }
  .row-acts button {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: #7a8199;
  }
  .row-acts button:hover { background: #e6e8f2; color: var(--accent); }
  .row-acts button.dl:hover { color: #2ba471; }
  .row-acts button.rm:hover { color: #d34a4a; }
  .song-row:hover .badge { display: none; }
  .row-acts .dl-ing { color: var(--accent); }

  /* 收藏浮层 */
  #pickMask {
    position: fixed; inset: 0; z-index: 90; display: none;
  }
  #pickMask.show { display: block; }
  #pickPop {
    position: fixed; z-index: 91; display: none;
    width: 230px; max-height: 320px; overflow-y: auto;
    background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(31,36,48,.18);
    padding: 8px; border: 1px solid var(--border);
  }
  #pickPop.show { display: block; }
  .pick-head { font-size: 12px; color: #9aa1b2; padding: 6px 10px 4px; }
  .pick-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: #454b59;
  }
  .pick-item:hover { background: #f1f2f9; }
  .pick-item .ok { margin-left: auto; color: var(--accent); font-weight: 700; }
  .pick-new {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--accent);
    border-top: 1px solid var(--border); margin-top: 4px;
  }
  .pick-new:hover { background: #f4f2ff; }
  .pick-empty { font-size: 12.5px; color: #b3b8c6; padding: 8px 10px; }

  .playall-btn {
    flex: none; font-size: 12.5px; padding: 7px 14px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: inline-flex; align-items: center; gap: 5px;
  }
  .playall-btn:hover { filter: brightness(1.08); }

  .empty-tip, .loading-tip {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9aa1b2; font-size: 14px; text-align: center; line-height: 2; pointer-events: none;
  }
  .empty-tip .big { font-size: 44px; }
  .spinner {
    width: 30px; height: 30px; border: 3px solid #e3e6f0; border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .more-btn {
    display: block; margin: 8px auto 14px; padding: 8px 26px;
    border: 1px solid var(--border); border-radius: 18px; font-size: 13px; color: var(--text-2);
  }
  .more-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* 歌词 */
  .lyric-body { flex: 1; overflow-y: auto; padding: 24px 26px; position: relative; }
  .lyric-line {
    padding: 7px 4px; font-size: 14px; color: #8a90a3; line-height: 1.6;
    border-radius: 8px; cursor: pointer; transition: color .25s, transform .25s;
    transform-origin: left center;
  }
  .lyric-line:hover { color: var(--text); }
  .lyric-line.active { color: var(--accent); font-weight: 600; transform: scale(1.04); }
  .lyric-empty { color: #9aa1b2; text-align: center; padding-top: 40%; line-height: 2; }

  /* ---------- 播放条 ---------- */
  footer {
    flex: none; display: flex; align-items: center; gap: 18px;
    padding: 12px 22px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .cover-wrap { width: 58px; height: 58px; flex: none; border-radius: 12px; overflow: hidden; background: #eceef5; box-shadow: var(--shadow); }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-wrap svg { width: 100%; height: 100%; display: block; }
  .np-info { width: 190px; flex: none; min-width: 0; }
  .np-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-artist { font-size: 12px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .center-zone { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .ctrl-row { display: flex; align-items: center; gap: 14px; }
  .ctrl-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #5b6170; transition: all .15s; }
  .ctrl-btn:hover { background: #f1f2f9; color: var(--accent); }
  .ctrl-btn.mode { font-size: 11px; font-weight: 700; }
  .play-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(79,70,229,.35);
    transition: transform .15s;
  }
  .play-btn:hover { transform: scale(1.06); }
  .progress-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px; }
  .time { font-size: 11px; color: #9aa1b2; width: 40px; flex: none; text-align: center; font-variant-numeric: tabular-nums; }
  .progress-track {
    flex: 1; height: 5px; background: #e8eaf1; border-radius: 3px;
    position: relative; cursor: pointer; touch-action: none;   /* 触屏拖动时不被页面滚动打断 */
  }
  .progress-track::before { content: ""; position: absolute; inset: -8px 0; }
  .progress-track.dragging { cursor: grabbing; }
  .progress-track.dragging .progress-thumb {
    opacity: 1; transform: translate(-50%, -50%) scale(1.2);
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
  }
  .progress-thumb {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent);
    transform: translate(-50%, -50%); left: 0%; opacity: 0; transition: opacity .15s;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .progress-track:hover .progress-thumb { opacity: 1; }

  .right-zone { width: 150px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .vol-icon { color: #5b6170; flex: none; }
  .vol-slider { width: 90px; accent-color: var(--accent); height: 4px; cursor: pointer; }
  .lyric-toggle { font-size: 12px; padding: 7px 12px; border-radius: 17px; border: 1px solid var(--border); color: var(--text-2); }
  .lyric-toggle:hover, .lyric-toggle.on { color: var(--accent); border-color: var(--accent); }

  /* 提示气泡 */
  #toast {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: rgba(31,36,48,.88); color: #fff; font-size: 13px;
    padding: 9px 20px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 99; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 移动端 ---------- */
  @media (max-width: 880px) {
    main { padding: 10px; gap: 10px; }
    header { padding: 10px 14px; gap: 10px; }
    .header-pad { display: none; }
    .menu-btn { display: grid; }
    .sidebar {
      position: fixed; top: 62px; bottom: 86px; left: 10px; width: 210px; z-index: 20;
      transform: translateX(-120%); transition: transform .25s; box-shadow: 0 10px 40px rgba(31,36,48,.25);
    }
    .sidebar.open { transform: translateX(0); }
    .lyric-panel.show { position: fixed; inset: 62px 10px 86px; z-index: 10; }
    .np-info { width: 120px; }
    .right-zone { width: auto; }
    .vol-slider { display: none; }
    .time { width: 34px; }
    footer { padding: 8px 12px; gap: 10px; }
    .cover-wrap { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn" title="歌单">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h12v2H3v-2z"/></svg>
  </button>
  <div class="logo">
    <span class="mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </span>
    音乐播放器
  </div>
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索歌曲 / 歌手 / 专辑…" autocomplete="off">
    <button id="searchBtn">搜索</button>
  </div>
  <div class="header-pad"></div>
</header>

<main>
  <aside class="sidebar" id="sidebar">
    <div class="sb-title">我的音乐</div>
    <div class="sb-item" id="navRecent">
      <span class="sb-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L8.8 12H6a7 7 0 1 1 7 7c-1.9 0-3.7-.8-4.9-2l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2V8H12z"/></svg></span>
      <span class="sb-name">最近播放</span>
      <span class="sb-count" id="recentCount"></span>
    </div>
    <div class="sb-title">我的歌单
      <button class="sb-new" id="newPlBtn" title="新建歌单">＋</button>
    </div>
    <div id="plNavBox"><div class="sb-empty">还没有歌单<br>点击"＋"新建</div></div>
  </aside>

  <section class="panel list-panel">
    <div class="panel-head">
      <span id="listTitle">搜索结果</span>
      <span style="display:flex;align-items:center;gap:10px">
        <button class="playall-btn" id="playAllBtn" style="display:none" title="播放全部">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>播放全部
        </button>
        <span class="sub" id="listCount"></span>
      </span>
    </div>
    <div class="panel-body" id="listBody">
      <div class="empty-tip" id="emptyTip">
        <div>
          <div class="big">&#9835;</div>
          搜索你想听的歌，点击即可播放
        </div>
      </div>
      <div id="songList"></div>
    </div>
  </section>

  <section class="panel lyric-panel" id="lyricPanel">
    <div class="panel-head"><span>歌词</span></div>
    <div class="lyric-body" id="lyricBody">
      <div class="lyric-empty" id="lyricEmpty">暂无歌词</div>
      <div id="lyricLines"></div>
    </div>
  </section>
</main>

<footer>
  <div class="cover-wrap" id="coverWrap">
    <svg viewBox="0 0 24 24" fill="#c3c8d6"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
  </div>
  <div class="np-info">
    <div class="np-name" id="npName">未在播放</div>
    <div class="np-artist" id="npArtist">搜索并点击歌曲开始听歌</div>
  </div>

  <div class="center-zone">
    <div class="ctrl-row">
      <button class="ctrl-btn mode" id="modeBtn" title="播放模式">顺序</button>
      <button class="ctrl-btn" id="prevBtn" title="上一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="播放/暂停">
        <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="下一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <span class="time" id="durTime">0:00</span>
    </div>
  </div>

  <div class="right-zone">
    <button class="ctrl-btn" id="dlBtn" title="下载当前歌曲">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>
    <button class="lyric-toggle" id="lyricToggle">歌词</button>
    <svg class="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80">
  </div>
</footer>

<div id="pickMask"></div>
<div id="pickPop"></div>

<div id="toast"></div>

<script>
"use strict";
/* ============================================================
 * 音乐播放器 · 阶段一（在线搜索 + 听歌）
 * 数据源：https://www.yinyueku.cn/api.php（JSONP）
 * 零依赖：原生 HTML/CSS/JS
 * ============================================================ */

const API = "https://www.yinyueku.cn/api.php";
const PAGE_SIZE = 30;
const SOURCE_LABEL = { netease: "网易云", tencent: "QQ音乐", kugou: "酷狗", kuwo: "酷我", migu: "咪咕" };

/* ---------- 通用工具 ---------- */
const $ = (id) => document.getElementById(id);
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* ---------- API 请求层 ----------
 * 两种模式：
 *  A. 页面由本地代理服务（server.py）提供时（http/https 同源）→ fetch /api 代理转发，
 *     由代理忽略上游证书问题（当前站点 TLS 证书已过期）
 *  B. file:// 直接打开 → JSONP 直连站点（站点修复证书后可用）
 */
const PROXY_MODE = location.protocol === "http:" || location.protocol === "https:";

let jsonpSeq = 0;
function jsonpDirect(params) {
  return new Promise((resolve, reject) => {
    const cbName = "__ym_cb_" + (++jsonpSeq) + "_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("请求超时")); }, 15000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("网络错误（file:// 直开受站点证书影响，请改用 启动播放器.bat）")); };
    const qs = new URLSearchParams();
    qs.set("callback", cbName);
    for (const k in params) qs.set(k, params[k]);
    script.src = API + "?" + qs.toString();
    document.head.appendChild(script);
  });
}

async function apiRequest(params) {
  if (PROXY_MODE) {
    const qs = new URLSearchParams();
    for (const k in params) qs.set(k, params[k]);
    const resp = await fetch("/api?" + qs.toString());
    const text = await resp.text();
    if (!resp.ok) throw new Error("代理服务异常 " + resp.status);
    try { return JSON.parse(text); }
    catch (e) { throw new Error("返回数据解析失败"); }
  }
  return jsonpDirect(params);
}

/* sign 机制：sign 随搜索结果下发且有时效，请求 url/pic/lyric 必须携带；
 * 失效时上游在字段里回"签名错误！"→ 自动重新搜索换取新 sign 并重试一次 */
function isSignError(x) { return typeof x === "string" && x.indexOf("签名错误") !== -1; }

async function refreshSign(song) {
  const artist0 = Array.isArray(song.artist) ? song.artist[0] : song.artist;
  const list = await apiRequest({
    types: "search", count: 10, pages: 1,
    name: (song.name || "") + " " + (artist0 || "")
  });
  if (!Array.isArray(list) || !list.length) throw new Error("刷新签名失败");
  const hit = list.find((s) => s.source === song.source && String(s.id) === String(song.id))
    || list.find((s) => s.source === song.source && s.name === song.name);
  if (!hit) throw new Error("刷新签名失败");
  song.sign = hit.sign;
  song.pic_id = hit.pic_id; song.url_id = hit.url_id; song.lyric_id = hit.lyric_id;
}

/* ---------- 全局状态 ---------- */
const state = {
  keyword: "", page: 1, lastCount: 0, loading: false, loadingMore: false,

  cur: -1,              // 当前播放索引
  mode: localStorage.getItem("ym_mode") || "order",   // order | loop | shuffle
  urlCache: new Map(),  // key -> mp3 直链（会话内缓存）
  lyric: { lines: [], idx: -1, offset: 0 },
  consecutiveErr: 0,
  seek: { active: false, ratio: 0 },   // 进度条拖动状态（预览中不触碰音频）
  view: { type: "search" },   // search | recent | playlist(id)

};

audio.preload = "auto";

/* ---------- 本地数据：歌单 / 最近播放 ---------- */
const sameSong = (a, b) => a.source === b.source && String(a.id) === String(b.id);

function songRefOf(song) {
  // 拷贝搜索结果字段（sign 随存；过期由 refreshSign 自愈）
  return {
    id: song.id, source: song.source, name: song.name,
    artist: song.artist, album: song.album,
    pic_id: song.pic_id, url_id: song.url_id, lyric_id: song.lyric_id, sign: song.sign
  };
}

function loadPlaylists() {
  try {
    const arr = JSON.parse(localStorage.getItem("ym_playlists") || "[]");

}
function savePlaylists() {

}
function loadRecent() {
  try {
    const arr = JSON.parse(localStorage.getItem("ym_recent") || "[]");
    state.recent = Array.isArray(arr) ? arr : [];
  } catch (e) { state.recent = []; }
}
function saveRecent() {
  localStorage.setItem("ym_recent", JSON.stringify(state.recent.slice(0, 50)));
}
function pushRecent(song) {
  state.recent = state.recent.filter((s) => !sameSong(s, song));
  state.recent.unshift(songRefOf(song));
  state.recent = state.recent.slice(0, 50);
  saveRecent();
  if (state.view.type === "recent") { renderList(); }
  renderSidebar();
}
function getPl(id) {
  return state.playlists.find((p) => p.id === id);
}
function viewTitle() {
  const v = state.view;
  if (v.type === "search") return state.keyword ? "搜索：“" + state.keyword + "”" : "搜索结果";
  if (v.type === "recent") return "最近播放";
  const pl = getPl(v.id);

/* ---------- 搜索 ---------- */
async function doSearch(fresh) {
  const kw = $("searchInput").value.trim();
  if (!kw) { toast("请输入搜索内容"); return; }
  if (state.loading || state.loadingMore) return;

  if (fresh) {
    state.keyword = kw; state.page = 1; state.loading = true;
    state.view = { type: "search" };   // 搜索即切回搜索视图
    $("emptyTip").style.display = "none";
    showListLoading();
  } else {
    state.loadingMore = true;
    const btn = $("moreBtn"); if (btn) { btn.disabled = true; btn.textContent = "加载中…"; }
  }
  try {
    const list = await apiRequest({ types: "search", count: PAGE_SIZE, pages: state.page, name: state.keyword });
    if (!Array.isArray(list)) throw new Error("返回格式异常");
    if (fresh) state.results = [];
    state.lastCount = list.length;
    state.results = state.results.concat(list);
    state.page++;
    renderList();
    if (fresh && state.results.length) toast("共找到 " + state.results.length + " 条（可加载更多）");
  } catch (err) {
    toast("搜索失败：" + err.message);
    if (fresh) { state.results = []; renderList(); }
  } finally {
    state.loading = false; state.loadingMore = false;
  }
}

/* ---------- 视图切换 ---------- */
function currentViewSongs() {
  const v = state.view;
  if (v.type === "search") return state.results;
  if (v.type === "recent") return state.recent;
  const pl = getPl(v.id);
  return pl ? pl.songs : [];
}

function switchView(view) {
  state.view = view;
  state.page = 1;
  state.cur = -1;   // 视图切换不自动播放，索引重置
  if (view.type === "search") {
    // 保留已有搜索结果
  } else {
    state.results = currentViewSongs();
  }
  renderList();
  renderSidebar();
}

/* ---------- 播放 ---------- */
async function fetchPlayUrl(song) {
  const key = songKey(song);
  if (state.urlCache.has(key)) return state.urlCache.get(key);
  const req = () => apiRequest({ types: "url", id: song.url_id || song.id, source: song.source, sign: song.sign || "" });
  let data = await req();
  if (data && isSignError(data.url)) {   // 签名过期：刷新后重试一次
    await refreshSign(song);
    data = await req();
  }
  const url = data && data.url;
  if (!url || url === "err" || isSignError(url)) throw new Error("该歌曲暂时无法播放");
  state.urlCache.set(key, url);
  return url;
}

async function playSong(i) {
  if (i < 0 || i >= state.results.length) return;
  const song = state.results[i];
  state.cur = i;
  state.consecutiveErr = 0;
  resetSeek();   // 切歌时进度条/拖动状态复位
  renderPlayingRow();
  updateNowPlaying(song);
  resetLyric();

  try {
    const url = await fetchPlayUrl(song);
    // 期间用户切换了歌曲则放弃
    if (state.cur !== i) return;
    audio.src = url;
    const p = audio.play();
    if (p) p.catch((err) => {
      if (err && err.name === "NotAllowedError") toast("浏览器拦截了自动播放，点击播放键开始");
      else toast("播放失败：" + (err && err.message ? err.message : "未知错误"));
    });
    pushRecent(song);   // 记录最近播放
    updatePlayIcon();
  } catch (err) {
    toast(song.name + "：" + err.message);
  }

  // 封面与歌词并行加载（不阻塞播放）
  loadCover(song);
  loadLyric(song);
}

function renderPlayingRow() {
  document.querySelectorAll(".song-row").forEach((row) => {
    row.classList.toggle("playing", Number(row.dataset.index) === state.cur);
  });
  const cur = document.querySelector('.song-row[data-index="' + state.cur + '"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function updateNowPlaying(song) {
  const artist = Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || "未知歌手");
  $("npName").textContent = song.name || "未知歌曲";
  $("npArtist").textContent = artist + (song.album ? " · " + song.album : "");
  document.title = song.name + " - " + artist + " | 音乐播放器";
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name || "", artist: artist, album: song.album || ""
    });
  }
}

/* ---------- 封面 ---------- */
async function loadCover(song) {
  const wrap = $("coverWrap");
  const fallback = '<svg viewBox="0 0 24 24" fill="#c3c8d6"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
  try {
    const req = () => apiRequest({ types: "pic", id: song.pic_id || "", source: song.source, song: song.id, sign: song.sign || "" });
    let data = await req();
    if (data && isSignError(data.url)) {
      await refreshSign(song);
      data = await req();
    }
    const url = data && data.url;
    if (state.cur !== state.results.indexOf(song)) return;
    if (!url || !/^https?:/.test(url)) { wrap.innerHTML = fallback; return; }
    wrap.innerHTML = "";
    const img = new Image();
    img.src = url; img.alt = "封面";
    img.onerror = () => { wrap.innerHTML = fallback; };
    wrap.appendChild(img);
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name || "",
          artist: Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || ""),
          album: song.album || "",
          artwork: [{ src: url, sizes: "300x300", type: "image/jpeg" }]
        });
      } catch (e) {}
    }
  } catch (e) { wrap.innerHTML = fallback; }
}

/* ---------- 歌词 ---------- */
function parseLrc(text) {
  const lines = []; let offset = 0;
  const om = text.match(/\[offset:\s*(-?\d+)\s*\]/i);
  if (om) offset = parseInt(om[1], 10) / 1000;
  const rowRe = /\[(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?\]/g;
  for (const raw of text.split(/\r?\n/)) {
    rowRe.lastIndex = 0;
    let m, times = [];
    while ((m = rowRe.exec(raw))) {
      let t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
      if (m[3]) t += parseInt(m[3].padEnd(3, "0"), 10) / 1000;
      times.push(t);
    }
    if (!times.length) continue;
    const txt = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const t of times) lines.push({ t: t, text: txt });
  }
  lines.sort((a, b) => a.t - b.t);
  return { lines: lines, offset: offset };
}

function resetLyric() {
  state.lyric = { lines: [], idx: -1, offset: 0 };
  $("lyricLines").innerHTML = "";
  $("lyricEmpty").style.display = "";
  $("lyricEmpty").textContent = "歌词加载中…";
}

async function loadLyric(song) {
  resetLyric();
  try {
    const req = () => apiRequest({ types: "lyric", id: song.lyric_id || song.id, source: song.source, song: song.id, sign: song.sign || "" });
    let data = await req();
    if (data && isSignError(data.lyric)) {
      await refreshSign(song);
      data = await req();
    }
    if (state.cur !== state.results.indexOf(song)) return;  // 期间已切歌，丢弃
    const text = data && data.lyric;
    if (!text || /签名错误|错误/.test(text) || !/\[\d{1,2}:\d{1,2}/.test(text)) {
      $("lyricEmpty").textContent = "暂无歌词";
      return;
    }
    state.lyric = parseLrc(text);
    state.lyric.idx = -1;
    const box = $("lyricLines");
    box.innerHTML = state.lyric.lines
      .map((l, i) => '<div class="lyric-line" data-i="' + i + '">' + (l.text ? esc(l.text) : "<br>") + "</div>")
      .join("");
    $("lyricEmpty").style.display = "none";
    box.querySelectorAll(".lyric-line").forEach((el) => {
      el.addEventListener("click", () => {
        const line = state.lyric.lines[Number(el.dataset.i)];
        if (line && isFinite(audio.duration)) audio.currentTime = Math.max(0, line.t - state.lyric.offset);
      });
    });
    syncLyric(true);
  } catch (e) {
    if (state.cur === state.results.indexOf(song)) $("lyricEmpty").textContent = "暂无歌词";
  }
}

function syncLyric(force) {
  const L = state.lyric;
  if (!L.lines.length) return;
  const t = audio.currentTime + L.offset;
  let idx = -1;
  // 从上次位置附近查找，避免每秒全表扫描
  const start = Math.max(0, L.idx);
  for (let i = start; i < L.lines.length; i++) {
    if (L.lines[i].t <= t) idx = i; else break;
  }
  if (idx === -1) {
    for (let i = 0; i < L.lines.length; i++) {
      if (L.lines[i].t <= t) idx = i; else break;
    }
  }
  if (idx === L.idx && !force) return;
  L.idx = idx;
  const box = $("lyricLines");
  const prev = box.querySelector(".lyric-line.active");
  if (prev) prev.classList.remove("active");
  if (idx >= 0) {
    const el = box.children[idx];
    if (el) {
      el.classList.add("active");
      const body = $("lyricBody");
      const target = el.offsetTop - body.clientHeight / 2 + el.clientHeight / 2;
      body.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    }
  }
}

/* ---------- 下载（前端 blob，失败降级新标签） ---------- */
function sanitizeName(s) {
  return String(s).replace(/[\\/:*?"<>|\r\n]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 120);
}

async function downloadSong(song, btn) {
  const key = songKey(song);
  if (state.downloading.has(key)) { toast("该歌曲正在下载中"); return; }
  state.downloading.add(key);
  if (btn) btn.classList.add("dl-ing");
  try {
    const url = await fetchPlayUrl(song);
    let ok = false;
    try {
      const resp = await fetch(url);   // 依赖 mp3 CDN 的 CORS 放行
      if (resp.ok) {
        const blob = await resp.blob();
        const artist = Array.isArray(song.artist) ? song.artist.join(" / ") : (song.artist || "");
        const a = document.createElement("a");
        const objUrl = URL.createObjectURL(blob);
        a.href = objUrl;
        a.download = sanitizeName(song.name + " - " + artist) + ".mp3";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 30000);
        ok = true;
        toast("已开始下载：" + song.name);
      }
    } catch (e) { /* CORS 或网络失败 → 降级 */ }
    if (!ok) {
      window.open(url, "_blank");
      toast("浏览器无法直接保存，已在新标签打开，请按 Ctrl+S 另存");
    }
  } catch (err) {
    toast("下载失败：" + err.message);
  } finally {
    state.downloading.delete(key);
    if (btn) btn.classList.remove("dl-ing");
  }
}

/* ---------- 歌单管理 ---------- */
function createPlaylist(name) {
  const pl = { id: "pl_" + Date.now() + "_" + Math.floor(Math.random() * 1e4), name: name, createdAt: Date.now(), songs: [] };
  state.playlists.push(pl);
  savePlaylists();
  return pl;
}

function promptNewPlaylist(thenAdd) {
  const name = (window.prompt("歌单名称：") || "").trim();
  if (!name) return;
  if (state.playlists.some((p) => p.name === name)) { toast("已有同名歌单"); return; }
  const pl = createPlaylist(name);
  toast("歌单「" + name + "」已创建");
  if (thenAdd) addToPlaylist(thenAdd, pl.id);
}

function showPlMenu(e, pid) {
  e.stopPropagation();
  const pl = getPl(pid);
  if (!pl) return;
  const act = window.prompt("歌单「" + pl.name + "」操作，输入序号：\n1. 重命名\n2. 删除歌单");
  if (act === "1") {
    const name = (window.prompt("新的歌单名称：", pl.name) || "").trim();
    if (!name) return;
    pl.name = name;
    savePlaylists();
    renderList();   // 当前若在该歌单视图，同步标题
    toast("已重命名为「" + name + "」");
  } else if (act === "2") {
    if (!window.confirm("确定删除歌单「" + pl.name + "」？（共 " + pl.songs.length + " 首，不可恢复）")) return;
    state.playlists = state.playlists.filter((p) => p.id !== pid);
    savePlaylists();
    if (state.view.type === "playlist" && state.view.id === pid) switchView({ type: "search" });
    else renderSidebar();
    toast("歌单已删除");
  }
}

/* ---------- 收藏浮层 ---------- */
let pickSong = null;
function openPick(song, btn) {
  pickSong = song;
  const pop = $("pickPop"), mask = $("pickMask");
  let html = '<div class="pick-head">收藏「' + esc(song.name) + "」到：</div>";
  if (!state.playlists.length) {
    html += '<div class="pick-empty">还没有歌单，先新建一个吧</div>';
  } else {
    html += state.playlists.map((p) => {
      const has = p.songs.some((s) => sameSong(s, song));
      return '<div class="pick-item" data-pl="' + esc(p.id) + '">' +
        '<span>' + esc(p.name) + '</span><span class="sb-count">' + p.songs.length + "</span>" +
        (has ? '<span class="ok">✓已收</span>' : "") + "</div>";
    }).join("");
  }
  html += '<div class="pick-new" id="pickNew">＋ 新建歌单并加入</div>';
  pop.innerHTML = html;
  pop.querySelectorAll(".pick-item").forEach((el) => {
    el.addEventListener("click", () => { addToPlaylist(pickSong, el.dataset.pl); closePick(); });
  });
  pop.querySelector("#pickNew").addEventListener("click", () => { promptNewPlaylist(pickSong); closePick(); });
  // 定位：按钮左侧弹出，贴屏幕边缘则回退
  const r = btn.getBoundingClientRect();
  pop.classList.add("show");
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = r.left - pw - 6, y = Math.min(r.top, window.innerHeight - ph - 12);
  if (x < 8) x = Math.min(r.right + 6, window.innerWidth - pw - 8);
  pop.style.left = x + "px";
  pop.style.top = Math.max(8, y) + "px";
  mask.classList.add("show");
}
function closePick() {
  $("pickPop").classList.remove("show");
  $("pickMask").classList.remove("show");
  pickSong = null;
}
$("pickMask").addEventListener("click", closePick);

function addToPlaylist(song, pid) {
  if (!song) return;
  const pl = getPl(pid);
  if (!pl) return;
  if (pl.songs.some((s) => sameSong(s, song))) { toast("已在歌单「" + pl.name + "」中"); return; }
  pl.songs.push(songRefOf(song));
  savePlaylists();
  toast("已收藏到「" + pl.name + "」");
  if (state.view.type === "playlist" && state.view.id === pid) renderList();
}

function removeFromPlaylist(song) {
  const v = state.view;
  if (v.type !== "playlist") return;
  const pl = getPl(v.id);
  if (!pl) return;
  pl.songs = pl.songs.filter((s) => !sameSong(s, song));
  savePlaylists();
  state.results = pl.songs;
  // 若移除的是正在播放的歌，只更新高亮显示，不打断播放
  if (state.cur >= pl.songs.length) state.cur = -1;
  renderList();
  toast("已从「" + pl.name + "」移除");
}

/* ---------- 侧边栏 / 抽屉 ---------- */
function closeSidebarIfMobile() {
  if (window.innerWidth <= 880) $("sidebar").classList.remove("open");
}

$("menuBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  $("sidebar").classList.toggle("open");
});
document.addEventListener("click", (e) => {
  const sb = $("sidebar");
  if (sb.classList.contains("open") && !e.target.closest("#sidebar") && !e.target.closest("#menuBtn")) {
    closeSidebarIfMobile();
  }
});

/* ---------- 播放控制 ---------- */
function nextIndex(dir, auto) {
  const n = state.results.length;
  if (!n) return -1;
  if (state.mode === "loop" && auto) return state.cur;
  if (state.mode === "shuffle") {
    if (n === 1) return 0;
    let r; do { r = Math.floor(Math.random() * n); } while (r === state.cur);
    return r;
  }
  return (state.cur + dir + n) % n;
}

function playNext(dir, auto) {
  const i = nextIndex(dir, auto);
  if (i >= 0) playSong(i);
  else toast("列表为空，先搜索几首歌吧");
}

function updatePlayIcon() {
  const playing = !audio.paused;
  $("iconPlay").style.display = playing ? "none" : "";
  $("iconPause").style.display = playing ? "" : "none";
}

/* ---------- 进度条 ----------
 * 拖动采用"预览 + 提交"两段式：
 *  按下/移动 → 仅更新滑块与时间显示（不触碰音频，避免连续 seek 卡顿）
 *  松开     → 一次性 seek 到目标位置，从该处继续播放
 */
function updateProgress() {
  if (state.seek.active) return;   // 拖动中显示由 seekPreview 接管
  const d = audio.duration || 0, t = audio.currentTime || 0;
  const pct = d ? (t / d) * 100 : 0;
  $("progressFill").style.width = pct + "%";
  $("progressThumb").style.left = pct + "%";
  $("curTime").textContent = fmtTime(t);
  $("durTime").textContent = fmtTime(d);
  $("progressTrack").setAttribute("aria-valuenow", Math.round(pct));
  syncLyric(false);
}

function seekPreview(ratio) {
  state.seek.ratio = ratio;
  const d = audio.duration || 0;
  const pct = (ratio * 100).toFixed(2) + "%";
  $("progressFill").style.width = pct;
  $("progressThumb").style.left = pct;
  $("curTime").textContent = fmtTime(ratio * d);   // 时间跟随滑块；总时长不变
}

function commitSeek(ratio) {
  const d = audio.duration;
  if (!isFinite(d) || d <= 0) { updateProgress(); return; }
  let t = ratio * d;
  if (t >= d - 0.25) t = Math.max(0, d - 0.25);   // 拖到结尾：留 0.25s 缓冲，播完自然切下一首
  audio.currentTime = t;
  updateProgress();   // 松手后恢复实时更新，并立即显示落点
}

function resetSeek() {
  state.seek.active = false;
  $("progressTrack").classList.remove("dragging");
}

function bindProgress() {
  const track = $("progressTrack");
  const ratioOf = (e) => {
    const rect = track.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - rect.left) / (rect.width || 1)));
  };
  track.addEventListener("pointerdown", (e) => {
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) { toast("歌曲还未加载完成，暂时不能拖动进度"); return; }
    state.seek.active = true;
    track.classList.add("dragging");
    try { track.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件等场景忽略 */ }
    seekPreview(ratioOf(e));
  });
  track.addEventListener("pointermove", (e) => {
    if (!state.seek.active) return;
    seekPreview(ratioOf(e));
  });
  const endDrag = () => {
    if (!state.seek.active) return;
    state.seek.active = false;
    track.classList.remove("dragging");
    commitSeek(state.seek.ratio);
  };
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);   // 触屏被系统手势打断等情况
  // 键盘可访问性：聚焦后 ←/±5s
  track.tabIndex = 0;
  track.setAttribute("role", "slider");
  track.setAttribute("aria-label", "播放进度");
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", "100");
  track.addEventListener("keydown", (e) => {
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    if (e.key === "ArrowRight") {
      e.preventDefault();
      commitSeek(Math.min(1, (audio.currentTime + 5) / d));
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      commitSeek(Math.max(0, (audio.currentTime - 5) / d));
    }
  });
}

/* ---------- 事件绑定 ---------- */
$("searchBtn").addEventListener("click", () => doSearch(true));
$("searchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(true); });

$("playBtn").addEventListener("click", () => {
  if (state.cur < 0) { if (state.results.length) playSong(0); else toast("先搜索并点一首歌"); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});

$("prevBtn").addEventListener("click", () => playNext(-1, false));
$("nextBtn").addEventListener("click", () => playNext(1, false));
bindProgress();   // 进度条：点击/拖动/键盘（含预览-提交两段式逻辑）

const MODE_TEXT = { order: "顺序", loop: "单曲", shuffle: "随机" };
function applyMode() {
  $("modeBtn").textContent = MODE_TEXT[state.mode] || "顺序";
  localStorage.setItem("ym_mode", state.mode);
}
$("modeBtn").addEventListener("click", () => {
  state.mode = state.mode === "order" ? "loop" : state.mode === "loop" ? "shuffle" : "order";
  applyMode();
  toast("播放模式：" + (MODE_TEXT[state.mode] || "顺序"));
});
applyMode();

const vol = $("volSlider");
vol.value = Math.round(audio.volume * 100);
vol.addEventListener("input", () => {
  audio.volume = vol.value / 100;
  localStorage.setItem("ym_vol", String(vol.value));
});

$("lyricToggle").addEventListener("click", () => {
  const p = $("lyricPanel");
  p.classList.toggle("show");
  $("lyricToggle").classList.toggle("on", p.classList.contains("show"));
});

/* 歌单 / 视图 / 下载 */
$("navRecent").addEventListener("click", () => { switchView({ type: "recent" }); closeSidebarIfMobile(); });
$("newPlBtn").addEventListener("click", (e) => { e.stopPropagation(); promptNewPlaylist(); });
$("playAllBtn").addEventListener("click", () => {
  if (state.results.length) playSong(0);
});
$("dlBtn").addEventListener("click", () => {
  if (state.cur < 0 || !state.results[state.cur]) { toast("当前没有正在播放的歌曲"); return; }
  downloadSong(state.results[state.cur], $("dlBtn"));
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("playBtn").click(); }
});

/* ---------- audio 事件 ---------- */
audio.addEventListener("play", updatePlayIcon);
audio.addEventListener("pause", updatePlayIcon);
audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("durationchange", updateProgress);
audio.addEventListener("playing", () => { state.consecutiveErr = 0; });
audio.addEventListener("ended", () => playNext(1, true));
audio.addEventListener("error", () => {
  if (!audio.src || state.cur < 0) return;
  state.consecutiveErr++;
  if (state.consecutiveErr >= 3) {
    toast("连续多首播放失败，请检查网络后重试");
    state.consecutiveErr = 0;
    return;
  }
  toast("当前歌曲播放失败，自动切换下一首");
  playNext(1, true);
});

if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack", () => playNext(-1, false));
    navigator.mediaSession.setActionHandler("nexttrack", () => playNext(1, false));
  } catch (e) {}
}

/* ---------- 初始化 ---------- */
loadPlaylists();
loadRecent();
renderSidebar();
renderList();
</script>
</body>
</html>
